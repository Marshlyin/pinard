[project]
name = "backend"
version = "0.1.0"
description = "Gestionnaire de cave à vin"
readme = "README.md"
authors = [
    { name = "Flavien BELLI", email = "flavien.belli@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "injector>=0.24.0",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.9.4",
]

# --- Configuration de l'outil UV ---
[tool.uv]
managed = true

# --- Configuration de PYTEST ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# --- Configuration de RUFF (Linting & Formatting) ---
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E, F : Erreurs et Pyflakes
# I : Isort (tri des imports)
# N : Naming (conventions de nommage)
# UP : Upgrade (syntaxe Python moderne)
# S : Bandit (sécurité)
# B : Bugbear (erreurs courantes)
# ANN : Type annotations
select = ["E", "F", "I", "N", "UP", "S", "B", "ANN201", "PT"]
ignore = ["ANN101"]                                           # Ignore "missing type for self"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # assert autorisé dans les tests pytest
